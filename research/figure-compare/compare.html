<!doctype html><meta charset="utf-8"><title>figure compare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Patrick+Hand&family=Playfair+Display:wght@500&display=swap">
<style>
body{margin:0;background:#0c0c0c;color:#e9e6df;font-family:'Crimson Pro',Georgia,serif;font-size:20px}
main{max-width:760px;margin:0 auto;padding:20px 30px}
h2{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;margin:36px 0 10px}
.cap{color:#8a8a84;font-size:16px;margin:6px 0 0}
img,svg,object{width:100%;display:block}
.pk svg text{font-family:'Crimson Pro',Georgia,serif;font-size:18px}
</style>
<main>
<h2>A · Manim still (current)</h2><img src="manim.png">
<h2>B · Rough.js SVG, page serif</h2><div id="b"></div>
<h2>C · Rough.js SVG, Patrick Hand</h2><div id="c"></div>
<h2>D · Pikchr SVG, inherits page font</h2><div id="d" class="pk"></div>
<h2>E · D2 sketch mode</h2><div id="e"></div>
</main>
<script>
for(const [id,f] of [['b','bank-rough-serif.svg'],['c','bank-rough-hand.svg'],['d','bank-pikchr.svg'],['e','bank-d2.svg']]){
  fetch(f).then(r=>r.text()).then(t=>{document.getElementById(id).innerHTML=t; const s=document.querySelector('#'+id+' svg'); if(s){s.removeAttribute('width');s.removeAttribute('height');}});
}
</script>
